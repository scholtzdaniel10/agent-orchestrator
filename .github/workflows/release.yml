name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.4,dioxus-cli@0.7.10
      - name: Check tag matches release version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match Tauri version $version" }
      - name: Format
        run: cargo fmt --all --check
      - name: Build UI
        working-directory: apps/ui
        run: dx build --release --platform web
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build standalone CLI
        run: |
          cargo build -p legate-cli --release --locked --target-dir target/cli-release
          Copy-Item target/cli-release/release/legate.exe target/legate-cli-windows-x86_64.exe
      - name: Build installer
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build
      - name: Upload NSIS installer
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            target/release/bundle/nsis/*.exe
            target/legate-cli-windows-x86_64.exe
