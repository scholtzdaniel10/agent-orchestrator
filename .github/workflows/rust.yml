name: Rust

on:
  pull_request:
  push:
    branches:
      - main
      - rust-rewrite

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude legate-desktop --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude legate-desktop --locked

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10
      - name: Build frontend assets before checking the desktop shell
        working-directory: apps/ui
        run: dx build --release --platform web
      - name: Check desktop
        run: cargo clippy -p legate-desktop --all-targets --locked -- -D warnings
      - name: Test desktop
        run: cargo test -p legate-desktop --locked
