[package]
name = "legate-desktop"
description = "Legate Tauri shell"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[[bin]]
name = "legate"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = { workspace = true }
legate-app = { path = "../../../crates/legate-app" }
legate-core = { path = "../../../crates/legate-core" }
legate-lead = { path = "../../../crates/legate-lead" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { workspace = true }
url = "2"

[target.'cfg(windows)'.dependencies]
# The same version and features Tauri builds, for shaped windows (SetWindowRgn).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
