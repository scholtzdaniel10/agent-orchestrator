  <text x="470" y="236" fill="#f2f2f2" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="132" letter-spacing="22">LEGATE</text>
  <rect x="474" y="266" width="660" height="3" fill="#d6262e"/>
  <text x="474" y="314" fill="#f2f2f2" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="30" letter-spacing="3">One lead. Every plan you already pay for.</text>

  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="25" fill="#f2f2f2">
    <rect x="474" y="370" width="10" height="10" fill="#d6262e"/>
