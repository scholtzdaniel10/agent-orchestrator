[workspace]
resolver = "3"
members = [
    "crates/legate-core",
    "crates/legate-store",
    "crates/legate-router",
    "crates/legate-providers",
    "crates/liteagent",
    "crates/legate-pty",
    "crates/legate-git",
    "crates/legate-lead",
    "crates/legate-bridge",
    "crates/legate-app",
    "crates/legate-cli",
    "apps/ui",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.2.0-rc.3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
criterion = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
turso = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
