ShortDescription: One lead that hands your coding work to Claude Code, Cursor and Grok on the plans you already pay for.
Description: |-
  Legate is a desktop app for people with more than one AI coding plan. You give one order; a lead reads the code, proposes jobs you can edit, and nothing runs until you press Run. Each agent works in its own git worktree, every file it reads and every command it runs is shown live, and you review and merge each change. It runs the official Claude Code and Cursor CLIs, signed in by you.
