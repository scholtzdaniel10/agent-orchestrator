default_job = "check"

[jobs.check]
command = ["cargo", "check", "--workspace", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--workspace"]
need_stdout = true

[jobs.ui]
command = ["cargo", "check", "--manifest-path", "apps/ui/Cargo.toml", "--target", "wasm32-unknown-unknown"]
need_stdout = false
