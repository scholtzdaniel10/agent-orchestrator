[package]
name = "legate-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local MCP bridge: JSON-RPC over HTTP on 127.0.0.1 with a bearer token"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
getrandom = { version = "0.2", features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
legate-core = { path = "../legate-core" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
subtle = "2"
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tower = { version = "0.5", features = ["util"] }
tracing = { workspace = true }

[dev-dependencies]
async-trait = "0.1"
legate-core = { path = "../legate-core" }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { workspace = true }
