[package]
name = "legate-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Legate main-process service: OrchestratorApi in Rust"

[dependencies]
async-trait = "0.1"
legate-bridge = { path = "../legate-bridge" }
legate-core = { path = "../legate-core" }
legate-git = { path = "../legate-git" }
legate-lead = { path = "../legate-lead" }
legate-providers = { path = "../legate-providers" }
legate-pty = { path = "../legate-pty" }
legate-router = { path = "../legate-router" }
legate-store = { path = "../legate-store" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
