[package]
name = "legate-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "legate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
legate-app = { path = "../legate-app" }
legate-core = { path = "../legate-core" }
legate-git = { path = "../legate-git" }
legate-lead = { path = "../legate-lead" }
legate-providers = { path = "../legate-providers" }
legate-store = { path = "../legate-store" }
ratatui = "0.29"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
